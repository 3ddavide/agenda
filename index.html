<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="theme-color" content="#2347d6">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>La mia agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, personal, very few words
   IDEA: a pocket agenda, one page per day
   PICTURE: today's five habits as big round checks
   COLOUR and TYPE: white ground, deep blue as the one dominant, area colours as tiny dots; Figtree
   LAYOUT: one 720px column, three tabs on top, cards stacked */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#111317);--card:light-dark(#f3f4f7,#1b1e24);--ink:light-dark(#15171c,#eef0f4);--mut:light-dark(#5f6570,#9ea5b1);--line:light-dark(#dfe2e8,#2c3038);--acc:light-dark(#2347d6,#86a0ff);--onacc:light-dark(#ffffff,#0c1230);--uni:#7b5cf0;--sport:#17a06c;--lavoro:#e8822a;--pers:#8a909b;--eventi:#d6458b;--red:light-dark(#cf3434,#ff8080)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;font-size:17px;margin-right:auto}
.tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:12px}
.tabs a{display:flex;align-items:center;justify-content:center;padding:6px 14px;min-height:38px;border-radius:9px;color:var(--mut);text-decoration:none;font-weight:700;font-size:15px}
.tabs a[aria-current=page]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.14)}
main{max-width:720px;margin:0 auto;padding:18px 16px 90px}
#note{max-width:720px;margin:0 auto;padding:0 16px;color:var(--mut);font-size:13px}
#note:empty{display:none}
.hero{padding:6px 0 18px}
.kick{margin:0;color:var(--acc);font-weight:700}
h1{font-size:clamp(34px,8vw,50px);line-height:1.05;margin:2px 0 6px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.sub{margin:0;color:var(--mut)}
h2{font-size:18px;margin:0 0 10px;font-weight:700}
.card{background:var(--card);border-radius:18px;padding:16px 18px;margin:0 0 14px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}.ch h2{margin:0}
.meter{flex:0 1 140px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);transition:width .3s}
ul{list-style:none;margin:0;padding:0}
button{font:inherit;color:inherit}
.hab{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:10px 2px;cursor:pointer;border-bottom:1px solid var(--line)}
.habits li:last-child .hab{border-bottom:0}
.tick{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;transition:transform .15s}
.hab:active .tick{transform:scale(.9)}
.hab.on .tick,.dotb.on,.chk.on{background:var(--acc);border-color:var(--acc)}
.hab.on .tick::after,.chk.on::after{content:"";width:12px;height:7px;border:solid var(--onacc);border-width:0 0 3px 3px;transform:translateY(-2px) rotate(-45deg)}
.hl{flex:1;font-size:17px;font-weight:600}
.hl small{display:block;font-weight:400;font-size:13px;color:var(--mut)}
.hab.on .hl{color:var(--mut)}
.streak{font-size:13px;color:var(--acc);font-weight:700;white-space:nowrap}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chk{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--mut);background:none;cursor:pointer;padding:0;display:grid;place-items:center}
.pri.on input{text-decoration:line-through;color:var(--mut)}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;width:100%}
.ag li{display:grid;grid-template-columns:3.6em 10px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ag li:last-child{border-bottom:0}
.tm{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15}
.tm small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.tt{overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:50%}
.uni{background:var(--uni)}.sport{background:var(--sport)}.lavoro{background:var(--lavoro)}.pers{background:var(--pers)}.eventi{background:var(--eventi)}
.ag li.done .tt{text-decoration:line-through;color:var(--mut)}
.acts{display:flex;gap:6px}
.mini{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mut);cursor:pointer;font-size:16px;padding:0}
.mini.on{background:var(--sport);border-color:var(--sport);color:#fff}
.dl{color:var(--red);font-size:13px;font-weight:700}
.fx{color:var(--mut)}
.why{display:block;font-size:13px;color:var(--mut)}
.ag li.skip .nm{text-decoration:line-through;color:var(--mut)}
.tl{display:flex;align-items:center;gap:8px;flex:1 1 140px;color:var(--mut)}
.empty{color:var(--mut);margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1 1 120px}.row>input[name=title]{flex:3 1 220px}
.cb{display:flex;align-items:center;gap:10px;margin:6px 0 12px;color:var(--mut)}
.cb input{width:20px;min-height:20px;accent-color:var(--acc)}
.primary{background:var(--acc);color:var(--onacc);border:0;border-radius:10px;padding:0 20px;min-height:44px;font-weight:700;cursor:pointer}
.navrow{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
.navrow h1{flex:1;text-align:center;font-size:clamp(22px,5vw,32px);margin:0}
.navrow button{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;cursor:pointer}
.scroll{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%}
.grid th,.grid td{padding:4px 1px;text-align:center}
.grid thead th{font-size:13px;color:var(--mut);font-weight:600;line-height:1.2}
.grid thead small{display:block;font-size:13px}
.grid thead th.td{color:var(--acc)}
.grid tbody th{text-align:left;font-weight:600;font-size:14px;padding-right:8px;width:8.5em;line-height:1.2}
.dotb{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;padding:0}
.pct td{font-size:13px;color:var(--mut);font-weight:700;padding-top:8px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin-bottom:14px}
.day{background:var(--card);border-radius:16px;padding:14px 16px}
.day.today{box-shadow:inset 0 0 0 2px var(--acc)}
.day h3{margin:0 0 2px;font-size:16px}.day h3 span{color:var(--mut);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:13px;color:var(--mut);text-align:center;font-weight:600;padding-bottom:2px}
.cell{border:0;border-radius:10px;min-height:54px;background:color-mix(in srgb,var(--acc) calc(var(--p) * 38%),var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px;cursor:pointer}
.cell.out{background:transparent;color:var(--mut)}
.num{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-weight:600;font-size:14px}
.cell.td .num{background:var(--acc);color:var(--onacc)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.dots{display:flex;gap:3px;min-height:7px}.dots i{width:7px;height:7px;border-radius:50%}.dots i.dlx{background:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mut);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.goals li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.goals li .tt{flex:1}.goals li.done .tt{text-decoration:line-through;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;white-space:nowrap}
.toast.show{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;min-height:32px}
@media(max-width:520px){.brand{display:none}.tabs{flex:1}.tabs a{flex:1;padding:6px 4px}.card{padding:14px}.grid tbody th{width:6.8em;font-size:13px}.dotb{width:28px;height:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.login{max-width:420px;margin:6vh auto 0}
.login h1{margin-bottom:8px}
.login form{display:grid;gap:10px;margin-top:16px}
.login .alt{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer;min-height:44px}
.err{color:var(--red);min-height:1.5em;margin:0}
.foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:0 16px;min-height:44px;color:var(--mut);font-weight:600;cursor:pointer}
body.out .tabs{visibility:hidden}
</style>
</head>
<body class="out">
<header class="top"><div class="in"><span class="brand">La mia agenda</span>
<nav class="tabs" aria-label="Viste"><a href="#oggi">Oggi</a><a href="#settimana">Settimana</a><a href="#mese">Mese</a></nav></div></header>
<p id="note"></p>
<main id="app"></main>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="tundo" hidden>Annulla</button></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
