<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e9e9ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e11" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>La mia agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Stile: monocromatico, widget in vetro trasparente su sfondo grigio sfumato.
   Il nero pieno (--solid) è riservato a: cose fatte, linea "adesso", oggi, contatori, pulsanti principali. */
:root{
  color-scheme:light;
  --bg:#e9e9ee;--bg2:#f5f5f8;--blob1:rgba(180,180,192,.55);--blob2:rgba(255,255,255,.9);
  --glass:rgba(255,255,255,.52);--glass-hi:rgba(255,255,255,.82);--chip:rgba(255,255,255,.75);
  --stroke:rgba(255,255,255,.75);--edge:rgba(20,20,30,.07);--gloss:rgba(255,255,255,.6);
  --shadow:0 10px 30px -12px rgba(30,30,45,.22),0 2px 6px -2px rgba(30,30,45,.08);
  --ink:#121216;--mut:#6c6c74;--faint:#a6a6ae;--line:rgba(20,20,30,.08);
  --solid:#121216;--onsolid:#ffffff;--empty:rgba(20,20,30,.22);
  --scrim:rgba(235,235,240,.35);--sheet:rgba(250,250,252,.86);
  /* le aree restano solo come etichette: tutto in scala di grigi */
  --uni:#55555c;--sport:#7a7a82;--lavoro:#3a3a40;--pers:#a0a0a8;--eventi:#2a2a30;--red:#121216;
}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){
  color-scheme:dark;
  --bg:#0e0e11;--bg2:#17171c;--blob1:rgba(90,90,105,.35);--blob2:rgba(60,60,72,.35);
  --glass:rgba(38,38,46,.55);--glass-hi:rgba(62,62,72,.8);--chip:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.09);--edge:rgba(0,0,0,.3);--gloss:rgba(255,255,255,.07);
  --shadow:0 12px 34px -14px rgba(0,0,0,.7),0 2px 6px -2px rgba(0,0,0,.4);
  --ink:#f2f2f5;--mut:#9d9da6;--faint:#64646c;--line:rgba(255,255,255,.08);
  --solid:#f2f2f5;--onsolid:#121216;--empty:rgba(255,255,255,.25);
  --scrim:rgba(10,10,12,.35);--sheet:rgba(30,30,36,.88);
  --uni:#b8b8c0;--sport:#8e8e96;--lavoro:#d6d6dc;--pers:#6e6e76;--eventi:#eeeef2;--red:#f2f2f5;
}}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#0e0e11;--bg2:#17171c;--blob1:rgba(90,90,105,.35);--blob2:rgba(60,60,72,.35);
  --glass:rgba(38,38,46,.55);--glass-hi:rgba(62,62,72,.8);--chip:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.09);--edge:rgba(0,0,0,.3);--gloss:rgba(255,255,255,.07);
  --shadow:0 12px 34px -14px rgba(0,0,0,.7),0 2px 6px -2px rgba(0,0,0,.4);
  --ink:#f2f2f5;--mut:#9d9da6;--faint:#64646c;--line:rgba(255,255,255,.08);
  --solid:#f2f2f5;--onsolid:#121216;--empty:rgba(255,255,255,.25);
  --scrim:rgba(10,10,12,.35);--sheet:rgba(30,30,36,.88);
  --uni:#b8b8c0;--sport:#8e8e96;--lavoro:#d6d6dc;--pers:#6e6e76;--eventi:#eeeef2;--red:#f2f2f5;
}
*{box-sizing:border-box;min-width:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;color:var(--ink);font:15px/1.35 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(60% 40% at 15% 8%,var(--blob2),transparent 70%),radial-gradient(55% 45% at 90% 35%,var(--blob1),transparent 70%),radial-gradient(70% 50% at 20% 95%,var(--blob1),transparent 70%),linear-gradient(170deg,var(--bg2),var(--bg));
  background-attachment:fixed;background-color:var(--bg);overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
ul{list-style:none;margin:0;padding:0}
:focus-visible{outline:2px solid var(--solid);outline-offset:2px}
#note{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 4px) 18px 0;color:var(--mut);font-size:13px}
#note:empty{display:none}

/* ---------- Cornice: intestazione, selettore, bacheca ---------- */
.shell{max-width:480px;margin:0 auto;height:100dvh;max-height:960px;display:flex;flex-direction:column;gap:12px;
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 16px)}
.hd{display:flex;align-items:flex-end;gap:8px;padding:0 4px}
.hd .tx{flex:1}
.hd .kick{margin:0;font-size:13px;font-weight:500;color:var(--mut)}
.hd h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.03em}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--stroke);box-shadow:var(--shadow),inset 0 1px 0 var(--gloss)}
.rbtn{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;position:relative}
.rbtn svg{width:22px;height:22px}
.rbtn .pip{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--solid)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;border-radius:22px}
.seg a{min-height:50px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);text-decoration:none;font-weight:700;font-size:16px;line-height:1.15}
.seg a small{font-weight:500;font-size:11.5px;color:var(--mut)}
.seg a[aria-current=page]{background:var(--glass-hi);color:var(--ink);box-shadow:0 4px 14px -6px rgba(0,0,0,.25),inset 0 1px 0 var(--gloss)}
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* ---------- Widget ---------- */
.w{position:relative;border-radius:24px;padding:13px 14px 12px;display:flex;flex-direction:column;min-height:0;overflow:hidden;cursor:pointer;text-align:left;
  transition:transform .18s ease}
.w::before{content:"";position:absolute;inset:0 0 50% 0;border-radius:inherit;background:linear-gradient(180deg,var(--gloss),transparent);pointer-events:none}
.w:active{transform:scale(.985)}
.w>*{position:relative}
.wh{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:700;font-size:14px;line-height:1.2}
.ic{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line)}
.ic svg{width:15px;height:15px}
.wh .meta{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.badge{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--solid);color:var(--onsolid);font-size:12px;font-weight:700;display:grid;place-items:center}
.wb{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.mutd{color:var(--mut)}.faint{color:var(--faint)}
.small{font-size:12px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Giorno: disposizione dei widget (2 colonne) */
.board.oggi{grid-template-rows:minmax(0,.82fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.62fr);
  grid-template-areas:"hab hab" "ag pr" "ag so" "pd pd"}
.a-hab{grid-area:hab}.a-ag{grid-area:ag}.a-pr{grid-area:pr}.a-so{grid-area:so}.a-pd{grid-area:pd}

/* Abitudini: cerchi spuntabili */
.habrow{flex:1;display:flex;justify-content:space-between;align-items:center;gap:4px}
.hc{all:unset;box-sizing:border-box;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-height:44px;padding:2px 0}
.hc .ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass-hi);box-shadow:inset 0 0 0 1.5px var(--empty),0 2px 6px -2px rgba(0,0,0,.15);transition:background .2s,transform .2s}
.hc.on .ring{background:var(--solid);box-shadow:0 4px 10px -3px rgba(0,0,0,.35)}
.hc .ring svg{width:20px;height:20px;stroke:var(--onsolid);stroke-width:2.6;opacity:0;transform:scale(.4);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.hc.on .ring svg{opacity:1;transform:none}
.hc.pop .ring{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}
.hc span{font-size:12px;font-weight:500;color:var(--mut)}

/* Agenda (anteprima) */
.agl{display:flex;flex-direction:column}
.agl li{display:grid;grid-template-columns:3em minmax(0,1fr);gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.agl li:last-child{border-bottom:0}
.agl .t{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.agl .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agl li.past .t,.agl li.past .n{color:var(--faint);text-decoration:line-through}
.agl li.now{display:flex;align-items:center;gap:8px;padding:4px 0;border:0;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.agl li.now::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--solid)}

/* Priorità e liste brevi */
.pl li{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13.5px;min-height:28px}
.cbx{all:unset;box-sizing:border-box;flex:none;width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--empty);display:grid;place-items:center;cursor:pointer;position:relative}
.cbx::before{content:"";position:absolute;inset:-12px}
.cbx.on{background:var(--solid);box-shadow:none}
.cbx.on::after{content:"";width:9px;height:5px;border:solid var(--onsolid);border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.pl li.done .x{color:var(--faint);text-decoration:line-through}
.pl .x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl li{padding:3px 0;line-height:1.25}
.sl li b{display:block;font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl li small{font-size:11.5px;color:var(--faint)}

/* Prepara domani */
.pd{flex:1;display:flex;align-items:center;gap:12px}
.pd p{flex:1;margin:0;font-size:13px;color:var(--mut);line-height:1.35}
.pill{flex:none;min-height:36px;padding:0 16px;border-radius:18px;border:0;font-weight:700;font-size:14px;cursor:pointer;background:var(--glass-hi);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.pill.solid{background:var(--solid);color:var(--onsolid);box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.w.hot{background:var(--glass-hi);box-shadow:var(--shadow),inset 0 0 0 1.5px var(--solid)}

/* Frecce accanto alla data (Settimana, Mese) */
.hd .kick{display:flex;align-items:center;gap:6px}
.kn{position:relative;flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:0;padding:0;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);cursor:pointer}
.kn::before{content:"";position:absolute;inset:-11px}
.kn svg{width:14px;height:14px}
.kn.txt{width:auto;padding:0 8px;font-size:12px;font-weight:700;border-radius:11px}

/* Settimana: disposizione */
.board.settimana{grid-template-rows:minmax(0,.92fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.62fr);
  grid-template-areas:"hab hab" "gi al" "gi pp" "rv rv"}
.board.settimana .a-hab{grid-area:hab}.a-gi{grid-area:gi}.a-al{grid-area:al}.a-pp{grid-area:pp}.a-rv{grid-area:rv}
.hg{flex:1;display:grid;grid-template-columns:4.4em repeat(7,minmax(0,1fr));align-items:center;justify-items:center;row-gap:2px;font-size:11.5px}
.hg .hl1{color:var(--mut);font-weight:600;font-size:11px}
.hg .hl1.td{color:var(--ink);font-weight:800}
.hg .hn{justify-self:start;color:var(--mut);font-weight:500;white-space:nowrap}
.pd2{display:block;width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--empty)}
.pd2.on{background:var(--solid);box-shadow:none}
.pd2.fut{box-shadow:none;border:1.5px dashed var(--empty)}
.gl{display:flex;flex-direction:column;flex:1;justify-content:space-between}
.gl li{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:6px;font-size:13px;padding:3px 0;border-bottom:1px solid var(--line)}
.gl li:last-child{border-bottom:0}
.gl li b{font-weight:700}
.gl li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl li.past{color:var(--faint)}.gl li.past b{text-decoration:line-through}
.gl li.td b,.gl li.td span{font-weight:800}
.big{display:flex;align-items:baseline;gap:2px;margin:2px 0 8px}
.big b{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1}
.big span{font-size:18px;color:var(--mut);font-weight:600}
.tdots{display:flex;flex-wrap:wrap;gap:5px}
.tdots .pd2{width:13px;height:13px}
.wt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* iPhone stretti (375 px: mini, SE): widget un po' più compatti */
@media (max-width:380px){
  .board{gap:10px}.w{padding:12px 11px 11px}
  .wh{gap:6px;font-size:13.5px}.ic{width:22px;height:22px}
  .fl li{font-size:11.8px;line-height:1.3}
}
.wh .badge,.wh .meta{flex:none}

/* Mese: disposizione */
.board.mese{grid-template-rows:minmax(0,1.15fr) minmax(0,1.15fr) minmax(0,.85fr) minmax(0,.85fr);
  grid-template-areas:"cal cal" "cal cal" "sc ob" "st fx"}
.a-cal{grid-area:cal}.a-sc{grid-area:sc}.a-ob{grid-area:ob}.a-st{grid-area:st}.a-fx{grid-area:fx}
.calw{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto repeat(var(--wk),minmax(0,1fr));gap:4px}
.wd2{text-align:center;font-size:11px;font-weight:600;color:var(--mut)}
.cc{position:relative;border:0;border-radius:9px;padding:0;min-height:0;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);
  background:color-mix(in srgb,var(--solid) calc(var(--p) * 34%),var(--glass-hi));display:grid;place-items:center}
.cc.out{background:transparent;color:var(--faint);font-weight:500}
.cc.td{background:var(--solid);color:var(--onsolid);font-weight:800}
.cc i{position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.bars{flex:1;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;min-height:0}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bar i{display:block;width:100%;max-width:22px;border-radius:5px 5px 3px 3px;background:var(--solid);opacity:.85}
.bar span{font-size:10.5px;color:var(--mut);font-weight:600}
.fl li{font-size:12.5px;line-height:1.35;padding:1px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
.fl li::first-line{color:var(--ink)}
.sl li b strong{font-weight:800}

/* Impostazioni: scelta del tema */
.tseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:16px;background:var(--line)}
.tseg button{min-height:44px;border:0;border-radius:12px;background:none;font-weight:600;color:var(--mut);cursor:pointer}
.tseg button[aria-pressed=true]{background:var(--glass-hi);color:var(--ink);box-shadow:0 2px 8px -3px rgba(0,0,0,.3)}

/* Pannelli: review e statistiche */
.rvl li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.rvl li:last-child{border-bottom:0}
.rvl .cbx{margin-top:2px;width:22px;height:22px;border-radius:7px}
.rvl b{display:block;font-weight:600}.rvl small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.rvl li.done b{text-decoration:line-through;color:var(--mut)}
.stl li{padding:10px 0;border-bottom:1px solid var(--line)}.stl li:last-child{border-bottom:0}
.stt{display:flex;justify-content:space-between;font-size:15px}.stt span{font-weight:800}
.stb{height:8px;border-radius:4px;background:var(--line);margin:6px 0 4px;overflow:hidden}.stb i{display:block;height:100%;background:var(--solid);border-radius:4px}
.stl small{color:var(--mut);font-size:12.5px}

/* Schermi piccoli (es. iPhone SE): si può scorrere */
@media (max-height:720px){
  .shell{height:auto;min-height:100dvh;max-height:none}
  .board.oggi,.board.settimana,.board.mese{grid-template-rows:auto;grid-auto-rows:minmax(150px,auto)}
  .board.oggi .a-hab{min-height:128px}.board .a-pd,.board .a-rv{min-height:96px}
  .board.mese .a-cal{min-height:330px}.board.settimana .a-gi{min-height:300px}
}
@media (min-width:700px){.shell{padding-top:28px}}

/* ---------- Viste non ancora ridisegnate (Settimana, Mese) ---------- */
.board.legacy{display:block;overflow:auto;border-radius:24px}
.card{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--stroke);box-shadow:var(--shadow);border-radius:24px;padding:14px 16px;margin:0 0 12px}
h2{font-size:16px;margin:0 0 8px;font-weight:700}
.sub{margin:0;color:var(--mut)}
.hint{color:var(--mut);font-size:13px;margin:4px 0}
.hint.center{text-align:center;margin-top:12px}
.empty{color:var(--mut);margin:4px 0}
.navrow{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.navrow h1{flex:1;text-align:center;font-size:20px;margin:0}
.navrow button{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--stroke);background:var(--glass);font-size:22px;cursor:pointer}
.scroll{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%}
.grid th,.grid td{padding:4px 1px;text-align:center}
.grid thead th{font-size:12px;color:var(--mut);font-weight:600;line-height:1.2}
.grid thead small{display:block;font-size:12px}
.grid thead th.td{color:var(--ink)}
.grid tbody th{text-align:left;font-weight:600;font-size:13px;padding-right:8px;width:7em;line-height:1.2}
.dotb{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--empty);background:none;cursor:pointer;padding:0}
.dotb.on{background:var(--solid);border-color:var(--solid)}
.pct td{font-size:12px;color:var(--mut);font-weight:700;padding-top:8px}
.days{display:grid;gap:12px;margin-bottom:12px}
.day{background:var(--glass);border:1px solid var(--stroke);border-radius:20px;padding:12px 14px}
.day.today{box-shadow:inset 0 0 0 1.5px var(--solid)}
.day h3{margin:0 0 2px;font-size:15px}.day h3 span{color:var(--mut);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:12px;color:var(--mut);text-align:center;font-weight:600;padding-bottom:2px}
.cell{border:0;border-radius:10px;min-height:48px;background:color-mix(in srgb,var(--solid) calc(var(--p) * 30%),var(--glass-hi));display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px;cursor:pointer;color:var(--ink)}
.cell.out{background:transparent;color:var(--faint)}
.num{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-weight:600;font-size:13px}
.cell.td .num{background:var(--solid);color:var(--onsolid)}
.cell.sel{box-shadow:inset 0 0 0 1.5px var(--ink)}
.dots{display:flex;gap:3px;min-height:6px}.dots i{width:6px;height:6px;border-radius:50%}.dots i.dlx{background:var(--solid)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.goals li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.goals li .tt{flex:1}.goals li.done .tt{text-decoration:line-through;color:var(--mut)}

/* ---------- Elementi comuni (pannelli, moduli, liste complete) ---------- */
.ag li{display:grid;grid-template-columns:3.4em 8px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ag li:last-child{border-bottom:0}
.tm{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15}
.tm small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.tt{overflow-wrap:anywhere}
.dot{width:8px;height:8px;border-radius:50%}
.uni{background:var(--uni)}.sport{background:var(--sport)}.lavoro{background:var(--lavoro)}.pers{background:var(--pers)}.eventi{background:var(--eventi)}
.ag li.done .tt{text-decoration:line-through;color:var(--mut)}
.acts{display:flex;gap:6px}
.mini{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--glass-hi);color:var(--mut);cursor:pointer;font-size:15px;padding:0}
.mini.on{background:var(--solid);border-color:var(--solid);color:var(--onsolid)}
.mini.txt{width:auto;padding:0 10px;font-size:13px;white-space:nowrap}
.mini.ovr{border-color:var(--solid);color:var(--ink)}
.dl{color:var(--ink);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.fx{color:var(--mut)}
.why{display:block;font-size:12px;color:var(--mut)}
.ag li.skip .nm{text-decoration:line-through;color:var(--mut)}
.lk{display:inline;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.hab{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:8px 2px;cursor:pointer;border-bottom:1px solid var(--line)}
.habits li:last-child .hab{border-bottom:0}
.tick{flex:none;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--empty);display:grid;place-items:center}
.hab.on .tick,.chk.on{background:var(--solid);box-shadow:none}
.hab.on .tick::after,.chk.on::after{content:"";width:11px;height:6px;border:solid var(--onsolid);border-width:0 0 2.5px 2.5px;transform:translateY(-1px) rotate(-45deg)}
.hl{flex:1;font-size:16px;font-weight:600}
.hl small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.hab.on .hl{color:var(--mut)}
.streak{font-size:12px;font-weight:700;white-space:nowrap}
.pri{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:0;box-shadow:inset 0 0 0 1.5px var(--empty);background:none;cursor:pointer;padding:0;display:grid;place-items:center}
.pri.on input{text-decoration:line-through;color:var(--mut)}
.pn{flex:none;width:22px;text-align:center;color:var(--mut);font-weight:700}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--glass-hi);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:44px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1 1 120px}.row>input[name=title]{flex:3 1 220px}
.row.end{justify-content:flex-end}
.tl{display:flex;align-items:center;gap:8px;flex:1 1 140px;color:var(--mut)}
.cb{display:flex;align-items:center;gap:10px;margin:6px 0 12px;color:var(--mut)}
.cb input{width:20px;min-height:20px;accent-color:var(--solid)}
.primary{background:var(--solid);color:var(--onsolid);border:0;border-radius:14px;padding:0 20px;min-height:44px;font-weight:700;cursor:pointer}
.ghost{background:var(--glass-hi);border:1px solid var(--line);border-radius:14px;padding:0 16px;min-height:44px;color:var(--ink);font-weight:600;cursor:pointer}
.foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* ---------- Pannello dal basso ----------
   Si ferma sotto il selettore dei livelli (top calcolato in app.js), che resta visibile. */
.ov{position:fixed;left:0;right:0;bottom:0;top:0;z-index:8;display:flex;align-items:flex-end;justify-content:center;
  background:var(--scrim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:26px 26px 0 0}
.sheet{position:relative;width:100%;max-width:480px;max-height:100%;overflow:auto;overscroll-behavior:contain;margin:0;border-radius:30px 30px 0 0;
  padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);background:var(--sheet);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);
  border:1px solid var(--stroke);border-bottom:0;box-shadow:0 -14px 40px -14px rgba(0,0,0,.28),inset 0 1px 0 var(--gloss);will-change:transform}
.grab{position:relative;width:96px;height:22px;margin:-4px auto 0;touch-action:none;cursor:grab}
.grab::after{content:"";position:absolute;left:28px;right:28px;top:8px;height:5px;border-radius:3px;background:var(--empty)}
.shh{display:flex;align-items:center;gap:12px;padding:8px 0 12px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.shh .ic{width:40px;height:40px;border-radius:12px}.shh .ic svg{width:21px;height:21px}
.shh .tx{flex:1}
.shh h2{margin:0;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.shh p{margin:2px 0 0;color:var(--mut);font-size:13px}
.shh .x{width:40px;height:40px;flex:none}.shh .x svg{width:18px;height:18px}
.sheet .card{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0;margin:0 0 14px}
.sheet h2{font-size:15px}
/* Agenda nei pannelli: orari grandi, niente pallini colorati, passati barrati */
.sheet .ag li{grid-template-columns:3.4em minmax(0,1fr) auto;padding:12px 0}
.sheet .ag .dot{display:none}
.sheet .ag .tm{font-size:17px}
.sheet .ag .tt{font-size:16px;font-weight:500}
.ag li.past .tm,.ag li.past .nm{color:var(--faint);text-decoration:line-through}
.ag li.past .why{color:var(--faint)}
.addrow{display:block;width:100%;min-height:50px;margin:14px 0 2px;border:0;border-radius:16px;background:var(--line);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}
/* Animazioni (spente con "Riduci movimento", vedi in fondo) */
.ov.anim{animation:ovIn .25s ease-out}
.sheet.anim{animation:shIn .34s cubic-bezier(.2,.9,.3,1)}
.ov.leaving{opacity:0;transition:opacity .22s ease-in}
@keyframes ovIn{from{opacity:0}}
@keyframes shIn{from{transform:translateY(100%)}}

/* ---------- Avviso in basso e accesso ---------- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--solid);color:var(--onsolid);padding:10px 16px;border-radius:16px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;white-space:nowrap;max-width:calc(100vw - 32px);font-weight:600;font-size:14px}
.toast span{white-space:normal}
.toast.show{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;min-height:32px}
.login{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12vh) 20px 40px}
.login .kick{margin:0;color:var(--mut);font-weight:600}
.login h1{margin:2px 0 8px;font-size:34px;font-weight:800;letter-spacing:-.03em}
.login form{display:grid;gap:10px;margin-top:16px}
.login .alt{background:none;border:0;color:var(--ink);font-weight:700;cursor:pointer;min-height:44px;text-decoration:underline}
.err{color:var(--ink);font-weight:600;min-height:1.5em;margin:0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<p id="note"></p>
<main id="app"></main>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="tundo" hidden>Annulla</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js?v=2026-11-22.1"></script>
